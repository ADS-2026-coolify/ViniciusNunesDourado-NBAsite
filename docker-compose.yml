services:
  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    restart: always
    environment:
      - PORT=3001
      - NODE_ENV=production
    ports:
      - "3046:3001"

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    restart: always
    environment:
      - PORT=3000
      - NODE_ENV=production
    ports:
      - "3045:3000"
    depends_on:
      - back
